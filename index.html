<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe4ef" />
  <title>Bunny Pilates · BASI Block Practice</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <!-- Installable app: opened from the home screen it runs without the browser's address bar. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bunny Pilates" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Home">
      <span class="brand-bunny" id="brand-bunny"></span>
      <span class="brand-text">Bunny Pilates</span>
    </a>
    <span class="streak" id="streak" title="Daily streak">🔥 0</span>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="mascot-bubble" id="bubble" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <nav class="bottomnav" aria-label="Main">
    <a href="#/" data-nav="home"><span>🏠</span>Home</a>
    <a href="#/learn" data-nav="learn"><span>📖</span>Learn</a>
    <a href="#/practice" data-nav="practice"><span>🎯</span>Practice</a>
    <a href="#/build" data-nav="build"><span>🧩</span>Build</a>
    <a href="#/settings" data-nav="settings"><span>⚙️</span>Settings</a>
  </nav>

  <script src="data.js"></script>
  <script src="poses.js"></script>
  <script src="poses/mat.js"></script>
  <script src="poses/reformer.js"></script>
  <script src="poses/cadillac.js"></script>
  <script src="poses/chair.js"></script>
  <script src="poses/other.js"></script>
  <script src="app.js"></script>
  <script>
    // Service workers need http(s); skip when opened straight from disk (file://).
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
